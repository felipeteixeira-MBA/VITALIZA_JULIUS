[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaliza-case"
version = "0.2.0"
description = "Pipeline reproduzível e harness de validação do case educacional Vitaliza"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=19,<27", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
analysis = ["plotly>=6,<7", "scipy>=1.14", "scikit-learn>=1.6", "statsmodels>=0.14", "pillow>=10", "joblib>=1.4", "threadpoolctl>=3"]

[project.scripts]
vitaliza = "vitaliza_case.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: requer os arquivos privados locais do data room"]
